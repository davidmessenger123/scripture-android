name: Android host tests

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: android-host-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-android.txt
      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl-dev \
            libglx-dev \
            libopengl-dev \
            ninja-build
      - name: Install pinned Qt host toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-android.txt
          python -m aqt install-qt linux desktop 6.9.0 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt" --internal
      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.9.0/gcc_64" \
            -DBUILD_TESTING=ON
      - name: Build core tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target scripture_core_tests --parallel
      - name: Run core tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -R '^scripture_core_tests$'
