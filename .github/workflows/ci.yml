name: Android host tests and APK

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: android-host-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-android.txt
      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl-dev \
            libegl1 \
            libgl-dev \
            libglx-dev \
            libopengl-dev \
            ninja-build
      - name: Install pinned Qt host toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-android.txt
          python -m aqt install-qt linux desktop 6.9.0 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt" --internal
      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.9.0/gcc_64" \
            -DBUILD_TESTING=ON
      - name: Build tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target scripture_core_tests scripture_manifest_tests scripture_qml_tests --parallel
      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      QT_VERSION: 6.9.0
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_API: 36
      ANDROID_CMDLINE_TOOLS_VERSION: 11076708
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-android.txt
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            curl \
            openjdk-17-jdk \
            patchelf \
            ninja-build \
            unzip
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_path=""
          for candidate in \
            "${ANDROID_SDK_ROOT:-}" \
            "${ANDROID_HOME:-}" \
            "$HOME/Android/Sdk" \
            "$HOME/android-sdk" \
            "/usr/local/lib/android/sdk" \
            "/opt/android-sdk" \
            "/usr/lib/android-sdk"; do
            [[ -n "$candidate" && -d "$candidate" ]] || continue
            for manager in \
              "$candidate"/cmdline-tools/*/bin/sdkmanager \
              "$candidate"/tools/bin/sdkmanager; do
              if [[ -x "$manager" ]]; then
                sdk_root="$candidate"
                sdkmanager_path="$manager"
                break 2
              fi
            done
          done
          if [[ -z "$sdkmanager_path" ]] && command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager_path="$(command -v sdkmanager)"
            resolved_sdkmanager="$(readlink -f "$sdkmanager_path")"
            candidate_root="$(dirname "$(dirname "$(dirname "$(dirname "$resolved_sdkmanager")")")")"
            if [[ -d "$candidate_root/platforms" || -d "$candidate_root/cmdline-tools" || -d "$candidate_root/tools" ]]; then
              sdk_root="$candidate_root"
            fi
          fi
          if [[ -z "$sdkmanager_path" || -z "$sdk_root" || ! -w "$sdk_root" ]]; then
            sdk_root="$RUNNER_TEMP/android-sdk"
            archive="$RUNNER_TEMP/android-command-line-tools.zip"
            extract="$RUNNER_TEMP/android-command-line-tools"
            rm -rf "$sdk_root" "$extract"
            mkdir -p "$sdk_root/cmdline-tools" "$extract"
            curl --fail --location --retry 3 \
              "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip" \
              --output "$archive"
            unzip -q "$archive" -d "$extract"
            mv "$extract/cmdline-tools" "$sdk_root/cmdline-tools/latest"
            sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          fi
          if ! test -x "$sdkmanager_path"; then
            printf '%s\n' "Android sdkmanager is not executable: $sdkmanager_path" >&2
            exit 1
          fi
          yes | "$sdkmanager_path" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager_path" --sdk_root="$sdk_root" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          printf 'ANDROID_HOME=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_ROOT=%s\n' "$sdk_root/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install pinned Qt host and Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-android.txt
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt" --internal
          python -m aqt install-qt linux android "$QT_VERSION" android_arm64_v8a --outputdir "$RUNNER_TEMP/Qt" --internal
      - name: Build pinned OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          tools/build_android_openssl.sh arm64-v8a
      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-android -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/Qt/${QT_VERSION}/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$RUNNER_TEMP/Qt/${QT_VERSION}/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DCMAKE_BUILD_TYPE=Debug
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-android --parallel
          test -f build-android/android-build/build/outputs/apk/debug/android-build-debug.apk
          unzip -l build-android/android-build/build/outputs/apk/debug/android-build-debug.apk | grep -F 'lib/arm64-v8a/libscriptureandroid.so'
          unzip -l build-android/android-build/build/outputs/apk/debug/android-build-debug.apk | grep -F 'classes.dex'
