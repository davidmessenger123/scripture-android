name: Android host tests and APK

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: android-host-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-android.txt
      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl-dev \
            libglx-dev \
            libopengl-dev \
            ninja-build
      - name: Install pinned Qt host toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-android.txt
          python -m aqt install-qt linux desktop 6.9.0 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt" --internal
      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.9.0/gcc_64" \
            -DBUILD_TESTING=ON
      - name: Build tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target scripture_core_tests scripture_manifest_tests scripture_qml_tests --parallel
      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      QT_VERSION: 6.9.0
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_API: 36
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-android.txt
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            curl \
            openjdk-17-jdk \
            patchelf \
            ninja-build \
            unzip
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if ! command -v sdkmanager >/dev/null; then
            printf '%s\n' 'Android sdkmanager is unavailable on this runner' >&2
            exit 1
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
      - name: Install pinned Qt host and Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-android.txt
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt" --internal
          python -m aqt install-qt linux android "$QT_VERSION" android_arm64_v8a --outputdir "$RUNNER_TEMP/Qt" --internal
      - name: Build pinned OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          tools/build_android_openssl.sh arm64-v8a
      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          cmake -S . -B build-android -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/Qt/${QT_VERSION}/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$RUNNER_TEMP/Qt/${QT_VERSION}/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DCMAKE_BUILD_TYPE=Debug
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          cmake --build build-android --parallel
          test -f build-android/android-build/build/outputs/apk/debug/android-build-debug.apk
          unzip -l build-android/android-build/build/outputs/apk/debug/android-build-debug.apk | grep -F 'lib/arm64-v8a/libscriptureandroid.so'
          unzip -l build-android/android-build/build/outputs/apk/debug/android-build-debug.apk | grep -F 'classes.dex'
